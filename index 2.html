document.addEventListener('change',e=>{const t=e.target,D=t.dataset;if(!D.ch)return;const v=t.value;
 switch(D.ch){
 case'tmode':T.mode=v;break;case'tsub':T.sub=v;break;case'tlk':T.lockOpt=t.checked;break;
 case'cs':S.subjects.find(x=>x.id===D.sid).ch.find(c=>c.id===D.id).s=+v;break;
 case'nt':S.notes.find(x=>x.id===D.id).t=v;break;case'nx':S.notes.find(x=>x.id===D.id).x=v;break;
 case'sn':if(v.trim())S.name=v.trim();break;case'st':S.scene=v;break;case'ss':S.sound=t.checked;break;
 case'sg':S.goal=Math.max(10,+v||120);break;case'sf':S.focus=Math.max(5,+v||25);break;}
 save();if(!['nt','nx'].includes(D.ch))render()});
setInterval(()=>{const c=$('clock');if(!c||!T.run)return;const f=S.focus*60,s=Math.floor(el()/1000);
 if(T.mode==='focus'&&s>=f){fin();render();return}
 const x=T.mode==='focus'?f-s:s;c.textContent=pad(Math.floor(x/3600))+':'+pad(Math.floor(x%3600/60))+':'+pad(x%60)},500);
let AC;function pop(){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(620,t+.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.17)}catch(e){}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,input[type=checkbox],select'))pop()});
document.addEventListener('pointermove',e=>{const g=$('glow');g.style.transform='translate('+(e.clientX-180)+'px,'+(e.clientY-180)+'px)'});
setInterval(()=>{const q=$('quote');if(!q)return;Q++;q.style.opacity=0;setTimeout(()=>{if($('quote')){$('quote').textContent=QS[Q%QS.length];$('quote').style.opacity=1}},350)},8000);
function updCD(){const c=$('cd');if(!c)return;const ex=S.exams.filter(e=>new Date(e.d+'T00:00')>Date.now()).sort((a,b)=>a.d<b.d?-1:1)[0];if(!ex||!A.cur){c.innerHTML='';delete c.dataset.d;return}const ms=new Date(ex.d+'T00:00')-Date.now(),d=Math.floor(ms/864e5),t=pad(Math.floor(ms%864e5/36e5))+':'+pad(Math.floor(ms%36e5/6e4))+':'+pad(Math.floor(ms%6e4/1e3));if(c.dataset.d===d+ex.id&&c.lastChild){c.lastChild.textContent=t}else{c.dataset.d=d+ex.id;c.innerHTML='<b>'+d+'</b><span>'+t+'</span>'}}
setInterval(updCD,1000);updCD();
render();
</script>
<script type="module">
const c=window.TIMENIA_FIREBASE;
if(c&&c.apiKey){
 try{
  const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
  const [{initializeApp},{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,GoogleAuthProvider,signInWithPopup,updateProfile},{getFirestore,doc,getDoc,setDoc}]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=initializeApp(c),auth=getAuth(app),db=getFirestore(app);
  window.FB={
   signUp:async(e,p,n)=>{const r=await createUserWithEmailAndPassword(auth,e,p);try{await updateProfile(r.user,{displayName:n})}catch(x){}return r.user},
   signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p),
   google:()=>signInWithPopup(auth,new GoogleAuthProvider()),
   out:()=>signOut(auth),
   load:async u=>{const s=await getDoc(doc(db,'users',u));return s.exists()?JSON.parse(s.data().d):null},
   save:(u,o)=>setDoc(doc(db,'users',u),{d:JSON.stringify(o)})
  };
  onAuthStateChanged(auth,u=>window.onFBUser&&window.onFBUser(u));
 }catch(e){window.onFBErr&&window.onFBErr(e)}
}
</script>
<script type="module">
const c=window.TIMENIA_SUPABASE;
if(c&&c.url&&c.key){
 try{
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
  const sb=createClient(c.url,c.key);window.FBG=!!c.google;
  const ER=e=>{const m=((e&&(e.code||e.message))||'').toLowerCase();throw {code:/confirm/.test(m)?'confirm-email':/already|registered/.test(m)?'email-already':/invalid/.test(m)?'invalid-credential':/weak|password/.test(m)?'weak':'x'}};
  window.FB={
   signUp:async(e,p,n)=>{const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:n}}});if(error)ER(error);if(!data.session)throw {code:'confirm-email'}},
   signIn:async(e,p)=>{const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)ER(error)},
   google:async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)ER(error)},
   out:()=>sb.auth.signOut(),
   load:async u=>{const {data}=await sb.from('profiles').select('d').eq('id',u).maybeSingle();return data?JSON.parse(data.d):null},
   save:async(u,o)=>{await sb.from('profiles').upsert({id:u,d:JSON.stringify(o)})}
  };
  sb.auth.onAuthStateChange((ev,s)=>{const u=s&&s.user;setTimeout(()=>{window.onFBUser&&window.onFBUser(u?{uid:u.id,email:u.email,displayName:u.user_metadata&&u.user_metadata.name}:null)},0)});
 }catch(e){window.onFBErr&&window.onFBErr(e)}
}
</script>
